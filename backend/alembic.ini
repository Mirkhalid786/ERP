# Alembic migration configuration
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file naming: rev_YYYYMMDD_description
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# SQLAlchemy connection URL — loaded from environment for safety
# Never hardcode credentials here.
sqlalchemy.url = %(DATABASE_URL_SYNC)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
